{# Uso: {% include "includes/campo.html" with campo=form.nombre %} #}
{# R27: el mensaje de error aparece junto al campo que lo causa. #}
<div class="campo{% if campo.errors %} campo-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text|safe }}</small>{% endif %}
  {% for error in campo.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
